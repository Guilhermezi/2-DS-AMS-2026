<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operadores</title>
</head>
<body>
    <form action="operadores.php" method="post">
    <!-- Cria o formulário. action: os dados serão enviados para operadores.php. method="post": os dados são enviados de forma oculta (não aparecem na URL). -->
        <fieldset>
        <!-- Cria uma caixa para agrupar campos relacionados. -->
            <legend>Dados do Aluno</legend>
            <!-- Título/legenda da caixa criada pelo fieldset. -->
            Nome: <input type="text" name="nome"><br><br>
            <!-- Campo de texto livre (type="text") para o nome. name="nome" é o identificador usado no PHP para recuperar o valor. <br> é quebra de linha. -->
            Telefone: <input type="text" name="telefone"><br><br>
            <!-- Campo de texto para o telefone. name="telefone" será lido no PHP. -->
            RG: <input type="text" name="rg"><br><br>
            <!-- Campo de texto para o RG. name="rg" será lido no PHP. -->
        </fieldset>
        <!-- Fecha a primeira caixa (Dados do Aluno). -->
        <br>
        <!-- Quebra de linha para separar os fieldsets. -->
        <fieldset>
        <!-- Inicia a segunda caixa de agrupamento. -->
            <legend>Dados Escolares</legend>
            <!-- Legenda da segunda caixa. -->
            Curso: <select name="curso">
            <!-- Cria uma lista suspensa. O valor escolhido será salvo com o name="curso". -->
                <option value="informatica">Informática</option>
                <!-- Opção: o texto exibido é "Informática", mas o valor enviado ao PHP será "informatica". -->
                <option value="enfermagem">Enfermagem</option>
                <!-- Opção: texto "Enfermagem", valor enviado "enfermagem". -->
                <option value="administracao">Administração</option>
                <!-- Opção: texto "Administração", valor enviado "administracao". -->
            </select><br><br>
            <!-- Fecha a lista suspensa e adiciona duas quebras de linha. -->
            Módulo: <input type="text" name="txtmodulo"><br><br>
            <!-- Campo de texto para o módulo. name="txtmodulo" será lido no PHP. -->
        </fieldset>
        <!-- Fecha a segunda caixa (Dados Escolares). -->
        <br>
        <!-- Quebra de linha de separação. -->
        <fieldset>
        <!-- Inicia a terceira caixa de agrupamento. -->
            <legend>Opções</legend>
            <!-- Legenda da terceira caixa. -->
            <input type="submit" value="Confirmar">
            <!-- Botão de envio: ao clicar, envia os dados do formulário para operadores.php. O texto do botão é "Confirmar". -->
            <input type="reset" value="Limpar">
            <!-- Botão de reset: limpa todos os campos do formulário. O texto é "Limpar". -->
        </fieldset>
        <!-- Fecha a terceira caixa (Opções). -->
    </form>
    <!-- Fecha o formulário. -->
</body>
</html>
