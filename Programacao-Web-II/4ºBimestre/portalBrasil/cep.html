<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de CEP — Brasil</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4/fonts/remixicon.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="bandeira.svg">
</head>
<body>
    <header>
        <img class="bandeira" src="bandeira.svg" alt="Bandeira do Brasil">
        <h1>Saiba tudo sobre o Brasil</h1>
        <h2>Em um lugar só</h2>
        <h3>Busca CEP</h3>
    </header>

    <main>
        <a class="voltar" href="index.html"><i class="ri-arrow-left-line"></i> Voltar</a>

        <form class="busca" onsubmit="event.preventDefault(); buscaCEP();">
            <input type="text" id="cepInput" placeholder="Digite seu CEP">
            <button type="submit">Consultar</button>
        </form>

        <div class="resultado">
            <h3 id="cep">CEP:</h3>
            <p id="state">Estado:</p>
            <p id="city">Cidade:</p>
            <p id="neighborhood">Bairro:</p>
            <p id="street">Rua:</p>
            <p id="location">Localização:</p>
            <p id="timezoneName">Fuso horário:</p>
        </div>

        <button class="limpar" onclick="limparResultados()">Limpar dados</button>
    </main>

    <footer>
        <p>© 2026 Guilherme Izidio Nogueira</p>
    </footer>

    <script src="cep.js"></script>
</body>
</html>
